# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: dark 
  color: blue

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'Zuse Institute Berlin'
    description: 'Jana Gonnermann - Research Area Lead for Humans and AI at Zuse Institute Berlin. Expert in agentic AI, machine learning, augmented reality, and human-centered design. Publications in CHI, ICIS, JCAL, and more.'
    twitter: ''
    image: 'images/uploads/avatar.png'
    keywords: 'Jana Gonnermann, AI researcher, Machine Learning, Augmented Reality, Human-Computer Interaction, Zuse Institute Berlin, Agentic AI, Cognitive Load, Educational Technology, CHI, ICIS, JCAL'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: 'Jana Gonnermann'

# Site footer
footer:
  copyright:
    notice: '© {year} Jana Gonnermann.'
    license:
      enable: true
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false

# Branding
branding:
  powered_by:
    enable: false
  attribution:
    enable: false
  footer_branding:
    enable: false
  show_branding:
    enable: false
  hugo_blox_branding:
    enable: false
