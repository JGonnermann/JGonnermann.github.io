<style>
  /* ---------- colours ---------- */
  :root,
  html[data-theme="light"],
  html[data-theme="dark"] {
    --global-theme-color: #2b5797;
    --global-hover-color: #2b5797;
  }

  /* ---------- one shared style for all pages (based on the publications page) ---------- */

  /* year headings: small, bold, left-aligned, black line below */
  .publications h2.bibliography {
    text-align: left;
    font-size: 1.15rem;
    font-weight: 700;
    border-top: none;
    border-bottom: 1px solid #111111;
    padding: 0 0 0.35rem;
    margin: 2.25rem 0 0.75rem;
  }

  /* section headings inside pages (e.g. "courses", "current thesis opportunities"):
     same size and weight as the year headings, without the line */
  article h2:not(.bibliography),
  article h3 {
    font-size: 1.15rem;
    font-weight: 700;
  }

  /* entries: no bullets, aligned with the headings */
  .publications ol.bibliography {
    padding-left: 0;
    margin-left: 0;
    list-style: none;
  }

  /* line below a title (venue, event, course): italic, as on the publications page */
  .publications ol.bibliography .periodical {
    font-style: italic;
  }
  .publications ol.bibliography .periodical .tag {
    font-style: normal;
  }

/* ===================== DARK MODE ===================== */
  html[data-theme="dark"] {
    --global-theme-color: #8fb3ea;
    --global-hover-color: #8fb3ea;
  }
  html[data-theme="dark"] .hero,
  html[data-theme="dark"] .thesis-box {
    background-color: #2a2b2f;
  }
  html[data-theme="dark"] .topic-tag {
    background-color: #1d2c44;
    border-color: #8fb3ea;
    color: #8fb3ea;
  }
  html[data-theme="dark"] .publications h2.bibliography,
  html[data-theme="dark"] .updates-header {
    border-bottom-color: #d9d9d9;
  }
  html[data-theme="dark"] ol.bibliography > li:hover,
  html[data-theme="dark"] .timeline-item:hover {
    background-color: #2a2b2f;
  }
  html[data-theme="dark"] ol.bibliography .author {
    color: #a6a6a6;
  }
  html[data-theme="dark"] ol.bibliography .periodical {
    color: #c4c4c4;
  }
  html[data-theme="dark"] ol.bibliography .links a.btn,
  html[data-theme="dark"] ol.bibliography .links .btn {
    color: #8fb3ea !important;
    border-color: #8fb3ea !important;
  }
  html[data-theme="dark"] ol.bibliography .links a.btn:hover,
  html[data-theme="dark"] ol.bibliography .links .btn:hover {
    background-color: #8fb3ea !important;
    color: #1c1c1d !important;
  }
  html[data-theme="dark"] .tag {
    color: #f0f0f0;
  }
  html[data-theme="dark"] .tag-academic {
    background-color: #1d3557;
    border-color: #4a78b8;
  }
  html[data-theme="dark"] .tag-public {
    background-color: #1c3b2a;
    border-color: #3f8f5e;
  }
  html[data-theme="dark"] .tag-poster,
  html[data-theme="dark"] .tag-role {
    background-color: #3a3b3f;
    border-color: #5c5d62;
  }
  html[data-theme="dark"] .tag-all {
    border-color: #777777;
  }
  html[data-theme="dark"] .talks-hint {
    color: #b0b0b0;
  }
  html[data-theme="dark"] #talks-search {
    border-color: #666666;
  }
  html[data-theme="dark"] .timeline {
    border-left-color: #555555;
  }
  html[data-theme="dark"] .timeline-item::before {
    background-color: #d9d9d9;
  }
  html[data-theme="dark"] .timeline-date {
    color: #a6a6a6;
  }
  html[data-theme="dark"] .updates-all {
    color: #a6a6a6 !important;
  }
</style>
