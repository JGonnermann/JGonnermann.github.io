{% assign updates = site.data.updates %}
{% assign max = include.limit | default: 1000 %}

<section class="updates">
  {% unless include.full %}
  <div class="updates-header">
    <span class="updates-title">latest updates</span>
    <a class="updates-all" href="{{ '/updates/' | relative_url }}">all updates →</a>
  </div>
  {% endunless %}

  <ul class="timeline">
    {% for item in updates limit: max %}
    <li class="timeline-item">
      <div class="timeline-date">{{ item.date | date: "%b %Y" }}</div>
      <div class="timeline-text">{{ item.text | markdownify }}</div>
    </li>
    {% endfor %}
  </ul>
</section>

<style>
  .updates {
    margin-top: 3rem;
  }
  .updates-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 0.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid #111111;
  }
  .updates-title {
    font-weight: 700;
    font-size: 1.25rem;
  }
  .updates-all {
    font-size: 0.9rem;
    color: #777777 !important;
    text-decoration: none !important;
  }
  .timeline {
    list-style: none;
    margin: 0;
    padding: 0 0 0 1.5rem;
    border-left: 1px solid #bbbbbb;
    margin-left: 0.35rem;
  }
  .timeline-item {
    position: relative;
    padding: 0.5rem 0.6rem;
    margin: 0 -0.6rem 0.75rem;
    border-radius: 4px;
    transition: background-color 0.15s ease;
  }
  .timeline-item:last-child {
    margin-bottom: 0;
  }
  .timeline-item:hover {
    background-color: #f0f0f0;
  }
  .timeline-item::before {
    content: "";
    position: absolute;
    left: calc(-1.5rem - 5px + 0.6rem);
    top: 0.95rem;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background-color: #111111;
  }
  .timeline-date {
    font-size: 0.85rem;
    color: #777777;
    margin-bottom: 0.2rem;
  }
  .timeline-text p {
    margin: 0;
  }
  .timeline-text ul {
    list-style: disc;
    margin: 0.35rem 0 0;
    padding-left: 1.2rem;
  }
  .timeline-text ul li {
    margin-bottom: 0.25rem;
  }
</style>
